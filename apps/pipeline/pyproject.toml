[project]
name = "pipeline"
version = "0.1.0"
description = "Rare Disease Atlas ingestion pipeline"
requires-python = ">=3.13"
dependencies = [
    "aiolimiter>=1.3.0",
    "backend",
    "biopython>=1.88",
    "hishel[async]>=1.4.0",
    "httpx>=0.28.1",
    "igraph>=1.0.0",
    "leidenalg>=0.12.0",
    "networkx>=3.7",
    "numpy>=2.5.3",
    "polars>=1.44.2",
    "pronto>=2.7.3",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "pyhpo>=4.0.0",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "tenacity>=9.1.4",
    "trafilatura>=2.3.0",
    "typer>=0.27.2",
]

[project.scripts]
atlas-pipeline = "pipeline.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
backend = { path = "../backend", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# Curated patient organizations, registries and umbrella networks for the demo cluster
# (developmental and epileptic encephalopathies / channelopathies).
#
# Every claim carries the page that states it and a verbatim quote from that page. At build time
# `sources/patient_orgs.py` fetches each page, cleans it with trafilatura and keeps a claim only if
# its quote occurs in the cleaned text (same whitespace/unicode normalization as abstract quote
# verification). An entry whose identity quote is not found is dropped entirely. All entries were
# checked against the live pages on 2026-10-03.
#
# Not listed because their sites refuse automated fetches (HTTP 403 bot challenge) or did not
# resolve when checked, so nothing could be verified: International Foundation for CDKL5 Research
# (cdkl5.com), SynGAP Research Fund, KCNQ2 Cure Alliance, Dravet Syndrome UK's own site, Loulou
# Foundation, NORD and EURORDIS member directories.

networks:
  - id: NET:dravet-europe
    name: Dravet Syndrome European Federation
    url: https://dravet.eu/
    country: Europe
    kind: patient_federation
    identity:
      url: https://dravet.eu/european-patient-registry/
      quote: "DSEF finds it very important to collect data in a proper, easy and ethical way"

  - id: NET:epicare
    name: EpiCARE (European Reference Network for rare and complex epilepsies)
    url: https://epi-care.eu/

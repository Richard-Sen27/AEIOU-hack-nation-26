# Small set of curated, cited facts ingested as ordinary assertions (source "curated").
# Every PMID was checked against PubMed; the `curated` connector re-verifies each title against
# the live E-utilities record at fetch time and the build fails if one does not match.
# The quote is the paper's title (an exact span of the cited record).
#
# Endpoints: {gene: SYMBOL}, {disease: MONDO label or id}, or {mechanism: loss_of_function |
# gain_of_function | dominant_negative}. For acts_via, `disease` names the condition in which
# the gene acts through that mechanism (used by Stage 5 for per gene-disease mechanisms).


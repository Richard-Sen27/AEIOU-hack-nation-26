# Railway config for the API service (docs/deploy-railway.md). Service settings: root directory
# /apps/backend, config file /apps/backend/railway.toml (the config path does not follow the root
# directory). Variables: see docs/deploy-railway.md; PORT=8000.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["/apps/backend/**"]

[deploy]
# Schema first, as atlas_owner (MIGRATION_DATABASE_URL); a failure keeps the old deployment.
preDeployCommand = ["alembic upgrade head"]
# An empty host binds IPv4 and IPv6: the health check arrives over IPv4, the frontend's proxy over
# the private network. With uvicorn, "::" listens on IPv6 only and the health check never passes.
startCommand = "python -c \"import uvicorn; uvicorn.run('backend.main:app', host='', port=8000, access_log=False)\""
# /health answers only after the graph is loaded into memory at start-up.
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

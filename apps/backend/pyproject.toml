[project]
name = "backend"
version = "0.1.0"
description = "Rare Disease Atlas API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.2",
    "en-core-web-lg",
    "fastapi>=0.142.2",
    "fastembed>=0.8.1",
    "httpx>=0.28.1",
    "langfuse>=4.16.0",
    "langgraph>=1.2.12",
    "networkx>=3.7",
    "numpy>=2.5.3",
    "openai>=3.24.0",
    "openai-agents>=0.23.1",
    "pgvector>=0.5.0",
    "pillow>=12.3.0",
    "pillow-heif>=1.8.0",
    "presidio-analyzer>=2.2.362",
    "presidio-anonymizer>=2.2.362",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "pymupdf>=1.28.2",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "python-magic>=0.4.27",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.1.3",
    "sse-starlette>=3.5.0",
    "textstat>=0.7.13",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
